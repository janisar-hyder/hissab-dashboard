<div class="toast-container">
  <div *ngFor="let toast of notifications()" 
       class="toast-item" 
       [class]="toast.type"
       (click)="remove(toast.id)">
    <div class="toast-icon">
      <i [class]="getIcon(toast.type)"></i>
    </div>
    <div class="toast-message">
      {{ toast.message }}
    </div>
    <button class="toast-close">
      <i class="las la-times"></i>
    </button>
  </div>
</div>
