<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <h1 class="page-title">Payments</h1>
        </div>
        <div class="header-actions" *ngIf="payments.length > 0">
            <app-bulk-actions [selectedCount]="selectedPaymentIds.size" [actions]="bulkActions"
                (actionSelected)="handleBulkAction($event)">
            </app-bulk-actions>
            <app-button variant="primary" iconPrefix="las la-plus" (clicked)="navigateToNew()">Add New Payment</app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16V4M12 16L8 12M12 16L16 12" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Import
            </app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Export
            </app-button>
        </div>
    </div>

    <!-- Data Card -->
    <div class="data-card" *ngIf="payments.length > 0 || searchQuery">
        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input" [(ngModel)]="searchQuery" (ngModelChange)="currentPage = 1">
                <i class="las la-times clear-icon" *ngIf="searchQuery" (click)="clearSearch()"></i>
            </div>

            <div class="toolbar-right">
                <app-custom-filter
                    [options]="filterOptions"
                    [currentFilter]="currentFilter"
                    activeLabelPrefix="All Payments"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll()">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible" [class.text-right]="col.id === 'amount'">
                                {{ col.label }}
                                <i [class]="sortColumn === col.id 
                                    ? (sortDirection === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                    : 'las la-sort'"
                                   (click)="sort(col.id, $event)"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of paginatedPayments" class="clickable-row" (click)="navigateToInfo(row.id)">
                        <td class="col-checkbox" (click)="$event.stopPropagation()">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="selectedPaymentIds.has(row.id)" (change)="toggleSelection(row.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td *ngIf="col.visible" [ngSwitch]="col.id" [class.text-right]="col.id === 'amount'">
                                <ng-container *ngSwitchCase="'paymentNumber'">
                                    <span class="font-medium">{{ row.paymentNumber }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'date'">
                                    <span>{{ row.date }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'vendorName'">
                                    <span>{{ row.vendorName }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'billNo'">
                                    <span>{{ row.billNo }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'paymentMode'">
                                    <span>{{ row.paymentMode }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'amount'">
                                    <span>BHD {{ row.amount | number:'1.3-3' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="'status-' + row.status.toLowerCase()">
                                        <span class="dot"></span>
                                        {{ row.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <div class="action-menu-container">
                                <button class="action-btn" (click)="toggleMenu(row.id, $event)">
                                    <i class="las la-ellipsis-h"></i>
                                </button>
                                <div class="action-dropdown" *ngIf="openMenuId === row.id">
                                    <button class="menu-item" (click)="navigateToEdit(row.id, $event)">Edit</button>
                                    <button class="menu-item delete-btn" (click)="openDeleteModal(row, $event)">
                                        <div class="svg-icon" style="-webkit-mask-image: url('/icons/delete.svg'); mask-image: url('/icons/delete.svg');"></div>
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <!-- Inner Empty State (Search) -->
                    <tr *ngIf="paginatedPayments.length === 0">
                        <td [attr.colspan]="availableColumns.length + 2" style="padding: 0;">
                            <app-empty-state 
                                [title]="searchQuery ? 'No Payments Found.' : 'No Payments Found.'"
                                [subtitle]="searchQuery ? 'We couldn\'t find any payments matching \'' + searchQuery + '\'' : 'It looks like you haven\'t added any payments yet.'"
                                [actionLabel]="searchQuery ? '' : 'Add New Payment'" 
                                [actionIconClass]="searchQuery ? '' : 'las la-plus'" 
                                (actionClick)="navigateToNew()">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <app-pagination [totalItems]="filteredPayments.length" [itemsPerPage]="itemsPerPage"
            [currentPage]="currentPage" (pageChange)="onPageChange($event)"
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <!-- External Empty State -->
    <app-empty-state *ngIf="payments.length === 0 && !searchQuery" 
        title="No Payments Found."
        subtitle="It looks like you haven't added any payments yet."
        actionLabel="Add New Payment" actionIconClass="las la-plus" (actionClick)="navigateToNew()">
    </app-empty-state>
</div>

<app-manage-columns [isOpen]="isManageColumnsOpen" [columns]="availableColumns" (closePanel)="isManageColumnsOpen = false"
    (columnsChange)="onColumnsChange($event)">
</app-manage-columns>

<app-delete-modal [isOpen]="!!paymentToDelete || bulkDeletePending" 
    [title]="bulkDeletePending ? 'Delete Payments' : 'Delete Payment'"
    [message]="bulkDeletePending 
        ? 'Are you sure you want to delete ' + selectedPaymentIds.size + ' selected payment(s)? This action cannot be undone.'
        : 'Are you sure you want to delete this payment? This action cannot be undone.'"
    (cancel)="closeDeleteModal()" (confirm)="confirmDelete()">
</app-delete-modal>
