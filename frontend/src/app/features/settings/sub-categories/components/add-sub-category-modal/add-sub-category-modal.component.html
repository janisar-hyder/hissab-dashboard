<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="icon-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <g clip-path="url(#clip0_1059_9439)">
            <mask id="mask0_1059_9439" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
              <path d="M24 0H0V24H24V0Z" fill="white"/>
            </mask>
            <g mask="url(#mask0_1059_9439)">
              <path d="M19.83 8.6998L15.3 4.1698C14.35 3.2198 13.04 2.7098 11.7 2.7798L6.69998 3.0198C4.69998 3.1098 3.10998 4.6998 3.00998 6.6898L2.76998 11.6898C2.70998 13.0298 3.20998 14.3398 4.15998 15.2898L8.68997 19.8198C10.55 21.6798 13.57 21.6798 15.44 19.8198L19.83 15.4298C21.7 13.5798 21.7 10.5598 19.83 8.6998ZM9.49998 12.3798C7.90998 12.3798 6.61998 11.0898 6.61998 9.4998C6.61998 7.9098 7.90998 6.6198 9.49998 6.6198C11.09 6.6198 12.38 7.9098 12.38 9.4998C12.38 11.0898 11.09 12.3798 9.49998 12.3798Z" fill="#0052FF"/>
            </g>
          </g>
          <defs>
            <clipPath id="clip0_1059_9439">
              <rect width="24" height="24" fill="white"/>
            </clipPath>
          </defs>
        </svg>
      </div>
      <h2 class="modal-title">Add New Sub Category</h2>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="subCategoryName">Sub Category Name<span class="required">*</span></label>
        <input type="text" id="subCategoryName" name="name" 
               [ngModel]="subCategory().name" 
               (ngModelChange)="updateSubCategoryField('name', $event)"
               placeholder="Enter Sub Category Name" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="parentCategory">Parent Category<span class="required">*</span></label>
        <app-custom-select 
            id="parentCategory" 
            name="parentCategory" 
            [ngModel]="subCategory().category_id" 
            (ngModelChange)="updateSubCategoryField('category_id', $event)"
            [options]="parentCategories()" 
            placeholder="Select Parent Category">
        </app-custom-select>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" 
                  [ngModel]="subCategory().description" 
                  (ngModelChange)="updateSubCategoryField('description', $event)"
                  placeholder="Enter Description" class="form-control" rows="4"></textarea>
      </div>
    </div>

    <div class="modal-actions">
      <app-button variant="outline" (clicked)="onCancel()">Cancel</app-button>
      <app-button variant="primary" (clicked)="onSave()" [disabled]="!subCategory().name || !subCategory().category_id">Save</app-button>
    </div>
  </div>
</div>
