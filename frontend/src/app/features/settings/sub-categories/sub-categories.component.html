<div class="page-container">
    <app-breadcrumbs [items]="[
        { label: 'Settings', url: '/settings' },
        { label: 'Sub Categories' }
    ]"></app-breadcrumbs>
    <app-page-header
        style="margin-bottom: var(--space-lg); display: block;"
        title="Sub Categories"
        addBtnText="Add New Sub Category"
        [showActions]="true"
        (addNew)="isAddModalOpen.set(true)"
        (importBtn)="onImport()"
        (exportBtn)="onExport()">

        <app-bulk-actions
            custom-actions
            *ngIf="selectedSubCategoryIds().size > 0"
            [selectedCount]="selectedSubCategoryIds().size"
            [actions]="dynamicBulkActions()"
            (actionSelected)="handleBulkAction($event)">
        </app-bulk-actions>
    </app-page-header>

    <div class="data-card" style="margin: 0; display: flex; flex-direction: column;" *ngIf="subCategories().length > 0 || searchQuery()">
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" 
                       [ngModel]="searchQuery()" 
                       (ngModelChange)="searchQuery.set($event); currentPage.set(1)"
                       placeholder="Search for something.." 
                       class="search-input">
                <i *ngIf="searchQuery()" class="las la-times clear-icon" (click)="clearSearch()"></i>
            </div>
            <div class="toolbar-actions">
                <app-custom-filter 
                    [options]="filterOptions" 
                    [currentFilter]="currentFilter()"
                    activeLabelPrefix="All Sub Categories"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll()">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns(); trackBy: trackByColumnId">
                            <th *ngIf="col.visible" [class.col-status]="col.id === 'status'">
                                {{ col.label }}
                                <i [class]="sortColumn() === col.id ? (sortDirection() === 'asc' ? 'las la-sort-up' : 'las la-sort-down') : 'las la-sort'" 
                                   (click)="sort(col.id, $event)"
                                   style="cursor: pointer; margin-left: 4px;"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody [class.loading]="isLoading()">
                    <tr *ngFor="let subCat of paginatedSubCategories(); trackBy: trackBySubCategoryId" [class.selected]="selectedSubCategoryIds().has(subCat.id)">
                        <td class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="selectedSubCategoryIds().has(subCat.id)" (change)="toggleSelection(subCat.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns(); trackBy: trackByColumnId">
                            <td *ngIf="col.visible" [ngSwitch]="col.id" [class.col-status]="col.id === 'status'" class="text-muted">
                                <ng-container *ngSwitchCase="'name'">
                                    <span class="item-name">{{ subCat.name }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'description'">
                                    {{ subCat.description || '-' }}
                                </ng-container>
                                <ng-container *ngSwitchCase="'parentCategory'">
                                    {{ subCat.category?.name || '-' }}
                                </ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="subCat.status.toLowerCase()">
                                        <span class="dot"></span>
                                        {{ subCat.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <app-action-menu [actions]="getActions(subCat)" [data]="subCat" (actionClick)="handleAction($event)"></app-action-menu>
                        </td>
                    </tr>
                    <!-- Empty Search State -->
                    <tr *ngIf="paginatedSubCategories().length === 0 && !isLoading()">
                        <td [attr.colspan]="availableColumns().length + 2" style="padding: 0;">
                            <app-empty-state 
                                [title]="(searchQuery() || currentFilter() !== 'All') ? 'No Sub Categories Found.' : 'No Sub Categories Found.'"
                                [subtitle]="searchQuery() ? 'We couldn\'t find any sub categories matching \'' + searchQuery() + '\'' : 'It looks like you haven\'t added any sub categories yet.'" 
                                [actionLabel]="(searchQuery() || currentFilter() !== 'All') ? '' : 'Add New Sub Category'"
                                [actionIconClass]="(searchQuery() || currentFilter() !== 'All') ? '' : 'las la-plus'" 
                                (actionClick)="isAddModalOpen.set(true)">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <app-pagination 
            [currentPage]="currentPage()"
            [totalItems]="filteredSubCategories().length"
            [itemsPerPage]="itemsPerPage()"
            (pageChange)="onPageChange($event)"
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <!-- Initial Empty State -->
    <app-empty-state 
        *ngIf="subCategories().length === 0 && !searchQuery() && !isLoading()"
        title="No Sub Categories Found."
        subtitle="It looks like you haven't added any sub categories yet." 
        actionLabel="Add New Sub Category"
        actionIconClass="las la-plus" 
        (actionClick)="isAddModalOpen.set(true)">
    </app-empty-state>
</div>

<app-add-sub-category-modal 
    *ngIf="isAddModalOpen()" 
    [subCategoryData]="subCategoryToEdit()"
    (close)="isAddModalOpen.set(false); subCategoryToEdit.set(null)"
    (save)="onSaveSubCategory($event)">
</app-add-sub-category-modal>

<app-manage-columns 
    [isOpen]="isManageColumnsOpen()"
    [columns]="availableColumns()"
    (columnsChange)="onColumnsChange($event)"
    (closePanel)="closeManageColumns()">
</app-manage-columns>

<!-- Delete Confirmation -->
<app-delete-modal 
    [isOpen]="!!subCategoryToDelete() || bulkDeletePending()" 
    [title]="bulkDeletePending() ? 'Delete Sub Categories' : 'Delete Sub Category'"
    [message]="bulkDeletePending() 
        ? 'Are you sure you want to delete ' + selectedSubCategoryIds().size + ' selected sub category(s)? This action cannot be undone.'
        : 'Are you sure you want to delete this sub category? This action cannot be undone.'" 
    (cancel)="subCategoryToDelete.set(null); bulkDeletePending.set(false)"
    (confirm)="confirmDelete()">
</app-delete-modal>
