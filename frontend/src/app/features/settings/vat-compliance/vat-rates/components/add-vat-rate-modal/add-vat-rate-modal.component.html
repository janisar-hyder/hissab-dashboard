            <h2 class="modal-title">Add New VAT Rate</h2>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label for="vatName">VAT Name<span class="required">*</span></label>
                <input type="text" 
                       id="vatName" 
                       name="vatName" 
                       [ngModel]="vatRate().name" 
                       (ngModelChange)="updateVatField('name', $event)"
                       class="form-control" 
                       placeholder="Enter VAT Name" 
                       required>
            </div>
            <div class="form-group">
                <label for="vatRateValue">Rate(%)<span class="required">*</span></label>
                <input type="number" 
                       id="vatRateValue" 
                       name="vatRateValue" 
                       [ngModel]="vatRate().rate" 
                       (ngModelChange)="updateVatField('rate', $event)"
                       class="form-control" 
                       placeholder="Enter Rate" 
                       required>
            </div>
        </div>

        <div class="modal-actions">
            <app-button variant="outline" (clicked)="onCancel()">Cancel</app-button>
            <app-button variant="primary" (clicked)="onSave()" [disabled]="!vatRate().name.trim() || vatRate().rate === null">Save</app-button>
        </div>
    </div>
</div>
