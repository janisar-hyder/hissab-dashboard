<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <h1 class="page-title">Chart of Accounts</h1>
        </div>
        <div class="header-actions" *ngIf="accounts().length > 0">
            <app-bulk-actions [selectedCount]="selectedAccountIds().size" [actions]="dynamicBulkActions()" (actionSelected)="handleBulkAction($event)"></app-bulk-actions>
            <app-button variant="primary" iconPrefix="las la-plus" (clicked)="navigateToNew()">Add New Account</app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16V4M12 16L8 12M12 16L16 12" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Import
            </app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Export
            </app-button>
        </div>
    </div>

    <!-- Data Card -->
    <div class="data-card" *ngIf="accounts().length > 0 || searchQuery()">
        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event); currentPage.set(1)">
                <i class="las la-times clear-icon" *ngIf="searchQuery()" (click)="clearSearch()"></i>
            </div>

            <div class="toolbar-right">
                <app-custom-filter
                    [options]="filterOptions"
                    [currentFilter]="currentFilter()"
                    activeLabelPrefix="All Accounts"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table tree-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll($event)">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <th *ngIf="availableColumns[0].visible">
                            Account Name
                            <i [class]="sortColumn() === 'name' 
                                ? (sortDirection() === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                : 'las la-sort'"
                               (click)="sort('name', $event)"></i>
                        </th>
                        <th *ngIf="availableColumns[1].visible">
                            Type
                            <i [class]="sortColumn() === 'type' 
                                ? (sortDirection() === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                : 'las la-sort'"
                               (click)="sort('type', $event)"></i>
                        </th>
                        <th *ngIf="availableColumns[2].visible">
                            Status
                            <i [class]="sortColumn() === 'status' 
                                ? (sortDirection() === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                : 'las la-sort'"
                               (click)="sort('status', $event)"></i>
                        </th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <ng-template #nodeTemplate let-node="node" let-level="level" let-isLast="isLast" let-ancestors="ancestors">
                        <tr class="tree-row" 
                            [class.is-expanded]="node.isExpanded" 
                            [class.has-children]="node.children?.length" 
                            [class.last-child-at-level]="isLast"
                            [ngClass]="'level-' + level">
                            <td class="col-checkbox">
                                <label class="custom-checkbox">
                                    <input type="checkbox" [checked]="selectedAccountIds().has(node.id)" (change)="toggleSelection(node, $event)">
                                    <span class="checkmark"></span>
                                </label>
                            </td>
                            <td class="col-account-name">
                                <div class="name-cell-inner" [ngStyle]="{'padding-left.px': level * 32}">
                                    <!-- Ancestor vertical lines: continuous lines at each ancestor's chevron center -->
                                    <ng-container *ngFor="let hasLine of ancestors; let i = index">
                                        <div class="ancestor-line" 
                                             *ngIf="hasLine"
                                             [ngStyle]="{'left.px': i * 32 + 11}">
                                        </div>
                                    </ng-container>

                                    <!-- L-shaped connector from immediate parent's chevron to this node -->
                                    <div class="hierarchy-connector" 
                                         *ngIf="level > 0"
                                         [ngStyle]="{'left.px': (level - 1) * 32 + 11, 'width.px': 21}">
                                    </div>
                                    
                                    <div class="expand-caret" *ngIf="node.children?.length" (click)="toggleExpand(node, $event)">
                                        <i class="las" [ngClass]="node.isExpanded ? 'la-angle-down' : 'la-angle-right'"></i>
                                    </div>
                                    <span class="account-label">{{ node.name }}</span>
                                </div>
                            </td>
                            <td>
                                <span class="text-muted">{{ node.type }}</span>
                            </td>
                            <td>
                                <span class="status-pill" [ngClass]="'status-' + node.status.toLowerCase()">
                                    <span class="dot"></span>
                                    {{ node.status }}
                                </span>
                            </td>
                            <td class="col-actions">
                                <app-action-menu
                                    [actions]="getActions(node)"
                                    [data]="node"
                                    (actionClick)="handleAction($event)">
                                </app-action-menu>
                            </td>
                        </tr>

                        <!-- Render children recursively -->
                        <ng-container *ngIf="node.children?.length && node.isExpanded">
                            <ng-container *ngFor="let child of node.children; let childLast = last; trackBy: trackById">
                                <ng-container *ngTemplateOutlet="nodeTemplate; context: { 
                                    node: child, 
                                    level: level + 1, 
                                    isLast: childLast, 
                                    ancestors: ancestors.concat(!childLast) 
                                }"></ng-container>
                            </ng-container>
                        </ng-container>
                    </ng-template>

                    <ng-container *ngFor="let acc of paginatedAccounts(); let last = last; trackBy: trackById">
                        <ng-container *ngTemplateOutlet="nodeTemplate; context: { 
                            node: acc, 
                            level: 0, 
                            isLast: last, 
                            ancestors: [] 
                        }"></ng-container>
                    </ng-container>
                    
                    <tr *ngIf="isLoading()">
                        <td colspan="5" class="text-center" style="padding: 40px;">
                            <div class="loading-spinner"></div>
                            <div class="text-muted mt-2">Loading accounts...</div>
                        </td>
                    </tr>
                    
                    <tr *ngIf="paginatedAccounts().length === 0 && !isLoading()">
                        <td colspan="5" style="padding: 0;">
                            <app-empty-state title="No Accounts Found." subtitle="Check your filters or add a new account."></app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <app-pagination [totalItems]="filteredAccounts().length" [itemsPerPage]="itemsPerPage()" [currentPage]="currentPage()" (pageChange)="onPageChange($event)" (itemsPerPageChange)="onItemsPerPageChange($event)"></app-pagination>
    </div>

    <app-empty-state *ngIf="accounts().length === 0 && !searchQuery()" title="No Accounts Found."
        subtitle="It looks like you haven't added any accounts yet."
        actionLabel="Add New Account" actionIconClass="las la-plus" (actionClick)="navigateToNew()">
    </app-empty-state>

</div>

<app-delete-modal [isOpen]="!!accountToDelete() || bulkDeletePending()" 
    [title]="bulkDeletePending() ? 'Delete Accounts' : 'Delete Account'"
    [message]="bulkDeletePending() 
        ? 'Are you sure you want to delete ' + selectedAccountIds().size + ' selected account(s)? This action cannot be undone.'
        : 'Are you sure you want to delete this account? This action cannot be undone.'"
    (cancel)="closeDeleteModal()" (confirm)="confirmDelete()">
</app-delete-modal>

<app-create-account-modal 
    *ngIf="isCreateModalOpen()"
    [parentAccounts]="parentAccountOptions()"
    [accountData]="accountToEdit()"
    (close)="closeCreateModal()"
    (save)="saveAccount($event)">
</app-create-account-modal>
