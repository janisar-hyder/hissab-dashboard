    <!-- Title -->
    <h2 class="modal-title">{{ isEditMode() ? 'Edit Account' : 'Create Account' }}</h2>

    <!-- Form -->
    <form class="modal-form" (ngSubmit)="onSave()">
      <div class="form-group">
        <label class="form-label">Account Type<span class="required">*</span></label>
        <app-custom-select 
          [options]="accountTypeOptions" 
          placeholder="Select Type" 
          [(ngModel)]="formData.type" 
          name="type" 
          required>
        </app-custom-select>
      </div>

      <div class="form-group">
        <label class="form-label">Account Name<span class="required">*</span></label>
        <input type="text" class="form-control" placeholder="Enter Account Name" [(ngModel)]="formData.name" name="name" required>
      </div>

      <div class="switch-container">
        <span class="switch-label">Add Parent Account</span>
        <label class="switch">
          <input type="checkbox" [(ngModel)]="formData.addParent" name="addParent">
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group animated-field" *ngIf="formData.addParent">
        <label class="form-label">Parent Account<span class="required">*</span></label>
        <app-custom-select 
          [options]="parentAccounts" 
          placeholder="Select Parent Account" 
          [(ngModel)]="formData.parentId" 
          name="parentId" 
          required>
        </app-custom-select>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-control textarea-control" placeholder="Enter Description" [(ngModel)]="formData.description" name="description" rows="3"></textarea>
      </div>

      <div class="modal-actions">
        <app-button variant="outline" type="button" (clicked)="closeModal()">Cancel</app-button>
        <app-button variant="primary" type="submit">{{ isEditMode() ? 'Update' : 'Save' }}</app-button>
      </div>
    </form>
  </div>
</div>
