<div class="page-container">
    <!-- Page Header (Exact ReceiptsNew structure) -->
    <div class="page-header">
        <div class="header-titles">
            <app-breadcrumbs [items]="[
                { label: 'Adjustments', url: '/inventory/adjustments' },
                { label: 'Add New Adjustment' }
            ]"></app-breadcrumbs>
            <h1 class="page-title">Add New Adjustment</h1>
        </div>
        <div class="header-actions">
            <app-button variant="outline" (clicked)="openAttachmentsModal()">
                <svg svg-icon style="margin-right: 8px;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <g clip-path="url(#clip0_attach)">
                        <mask id="mask0_attach" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
                            <path d="M20 0H0V20H20V0Z" fill="white" />
                        </mask>
                        <g mask="url(#mask0_attach)">
                            <path d="M10.2752 17.7837C9.36683 17.7837 8.4585 17.442 7.76686 16.7503C6.38353 15.367 6.38353 13.1253 7.76686 11.742L9.8335 9.68367C10.0752 9.442 10.4752 9.442 10.7168 9.68367C10.9585 9.92533 10.9585 10.3253 10.7168 10.567L8.65016 12.6253C7.75853 13.517 7.75853 14.9753 8.65016 15.867C9.54183 16.7587 11.0002 16.7587 11.8918 15.867L15.1335 12.6253C16.1168 11.642 16.6585 10.3337 16.6585 8.942C16.6585 7.55029 16.1168 6.24196 15.1335 5.25863C13.1002 3.22529 9.80016 3.22529 7.76686 5.25863L4.23353 8.792C3.40853 9.617 2.9502 10.717 2.9502 11.8837C2.9502 13.0503 3.40853 14.1503 4.23353 14.9753C4.4752 15.217 4.4752 15.617 4.23353 15.8587C3.99186 16.1003 3.59186 16.1003 3.3502 15.8587C2.29186 14.792 1.7002 13.3837 1.7002 11.8837C1.7002 10.3837 2.28353 8.967 3.3502 7.90863L6.88353 4.37529C9.40016 1.85863 13.5002 1.85863 16.0168 4.37529C17.2335 5.59196 17.9085 7.21696 17.9085 8.942C17.9085 10.667 17.2335 12.292 16.0168 13.5087L12.7752 16.7503C12.0835 17.442 11.1835 17.7837 10.2752 17.7837Z" fill="#646569" />
                        </g>
                    </g>
                    <defs>
                        <clipPath id="clip0_attach">
                            <rect width="20" height="20" fill="white" />
                        </clipPath>
                    </defs>
                </svg>
                Attach Documents
            </app-button>
        </div>
    </div>

    <!-- Form Container (Exact ReceiptsNew structure) -->
    <div class="form-container">

        <!-- Form Card 1: Adjustment Header -->
        <div class="form-card">
            <!-- Row 1: Date, Reason, Type -->
            <div class="form-grid form-grid-3" style="margin-bottom: 24px;">
                <div class="form-group">
                    <label>Date <span class="required">*</span></label>
                    <input type="date" class="form-control date-input" [(ngModel)]="adjustmentData.date">
                </div>
                <div class="form-group">
                    <label>Reason <span class="required">*</span></label>
                    <app-custom-select 
                        [(ngModel)]="adjustmentData.reason" 
                        [options]="reasonOptions" 
                        placeholder="Select Reason">
                    </app-custom-select>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <app-custom-select 
                        [(ngModel)]="adjustmentData.type" 
                        [options]="typeOptions" 
                        placeholder="Quantity">
                    </app-custom-select>
                </div>
            </div>

            <!-- Row 2: Reference Number -->
            <div class="form-grid form-grid-3">
                <div class="form-group">
                    <label>Reference Number</label>
                    <input type="text" class="form-control" [(ngModel)]="adjustmentData.referenceNumber" placeholder="Enter Reference Number">
                </div>
            </div>
        </div>

        <!-- Form Card 2: Items Table Matched to ReceiptsNew -->
        <div class="form-card">
            
            <div class="receipt-table-wrapper">
                <div class="receipt-table">
                    <!-- Table Header (Dynamic based on Type) -->
                    <div class="receipt-thead">
                        <div class="th-item">Item & Description</div>
                        
                        <!-- Quantity Headers -->
                        <ng-container *ngIf="adjustmentData.type === 'Quantity'">
                            <div class="th-stock-avail">Stock Available</div>
                            <div class="th-stock-hand">Stock in Hand</div>
                            <div class="th-adj-qty">Adjusted Quantity</div>
                        </ng-container>

                        <!-- Value Headers -->
                        <ng-container *ngIf="adjustmentData.type === 'Value'">
                            <div class="th-stock-avail">Stock Value</div>
                            <div class="th-stock-hand">Current Value</div>
                            <div class="th-adj-qty">Adjusted Value</div>
                        </ng-container>

                        <div class="th-action"></div>
                    </div>

                    <!-- Table Rows -->
                    <div class="receipt-tbody">
                        <div class="receipt-row" *ngFor="let item of adjustmentItems; let i = index">
                            <div class="td-cell td-item">
                                <app-custom-select 
                                    [(ngModel)]="item.itemId" 
                                    [options]="itemOptions" 
                                    placeholder="Select Item"
                                    (ngModelChange)="onItemChange(item)">
                                </app-custom-select>
                            </div>

                            <!-- Quantity Cells -->
                            <ng-container *ngIf="adjustmentData.type === 'Quantity'">
                                <div class="td-cell td-stock-avail text-right">
                                    <span class="text-muted">{{ item.stockAvailable }}</span>
                                </div>
                                <div class="td-cell td-stock-hand">
                                    <div class="cell-input-wrapper">
                                        <input type="number" 
                                               class="cell-input" 
                                               [(ngModel)]="item.stockInHand" 
                                               (ngModelChange)="onStockInHandChange(item)"
                                               placeholder="0">
                                    </div>
                                </div>
                                <div class="td-cell td-adj-qty">
                                    <div class="cell-input-wrapper">
                                        <input type="number" 
                                               class="cell-input" 
                                               [(ngModel)]="item.adjustedQuantity" 
                                               (ngModelChange)="onAdjustedQuantityChange(item)"
                                               placeholder="0">
                                    </div>
                                </div>
                            </ng-container>

                            <!-- Value Cells -->
                            <ng-container *ngIf="adjustmentData.type === 'Value'">
                                <div class="td-cell td-stock-avail text-right">
                                    <span class="text-muted">{{ item.stockValue | number:'1.3-3' }}</span>
                                </div>
                                <div class="td-cell td-stock-hand">
                                    <div class="cell-input-wrapper">
                                        <input type="number" 
                                               class="cell-input" 
                                               [(ngModel)]="item.currentValue" 
                                               (ngModelChange)="onCurrentValueChange(item)"
                                               placeholder="0.000"
                                               step="0.001">
                                    </div>
                                </div>
                                <div class="td-cell td-adj-qty">
                                    <div class="cell-input-wrapper">
                                        <input type="number" 
                                               class="cell-input" 
                                               [(ngModel)]="item.adjustedValue" 
                                               (ngModelChange)="onAdjustedValueChange(item)"
                                               placeholder="0.000"
                                               step="0.001">
                                    </div>
                                </div>
                            </ng-container>

                            <div class="td-cell td-action text-center">
                                <button class="del-btn" (click)="removeRow(i)" [disabled]="adjustmentItems.length === 1">
                                    <img src="icons/delete.svg" alt="Delete">
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Actions Strip -->
            <div class="add-row-actions">
                <button class="add-link-btn" (click)="addNewRow()">
                    <span class="add-plus">+</span> Add New Row
                </button>
                <button class="add-link-btn" (click)="openBulkModal()">
                    <span class="add-plus">+</span> Add Items in Bulk
                </button>
            </div>

            <!-- Notes Section (Exact ReceiptsNew structure) -->
            <div class="notes-container">
                <label class="notes-label">Notes (For Internal Use)</label>
                <textarea class="notes-textarea" [(ngModel)]="adjustmentData.notes" placeholder="Enter Note"></textarea>
            </div>
        </div>
    </div>

    <!-- Sticky Footer (Exact ReceiptsNew structure) -->
    <div class="page-footer">
        <button class="footer-btn btn-cancel" (click)="cancel()">Cancel</button>
        <button class="footer-btn btn-draft" (click)="saveAsDraft()">Save as Draft</button>
        <button class="footer-btn btn-save" (click)="save()">Save</button>
    </div>
</div>

<!-- Bulk Add Modal Drawer (Standardized from Quotations) -->
<div class="bulk-modal-backdrop" *ngIf="isBulkModalOpen" (click)="closeBulkModal()">
    <div class="bulk-modal-drawer" (click)="$event.stopPropagation()">
        <div class="bulk-header">
            <h3>Add Items</h3>
            <button class="close-btn" (click)="closeBulkModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="bulk-search-wrapper">
            <div class="search-input-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="bulk-search-input" placeholder="Search for Items" [(ngModel)]="bulkSearchTerm">
            </div>
        </div>

        <div class="bulk-items-list-wrapper">
            <!-- Select All -->
            <label class="bulk-item-row bulk-select-all">
                <div class="checkbox-wrapper">
                    <input type="checkbox" [checked]="isAllFilteredSelected()" (change)="toggleSelectAllBulk($event)">
                    <span class="checkmark"></span>
                </div>
                <span class="item-name-label">Select All</span>
            </label>

            <!-- List -->
            <label class="bulk-item-row" *ngFor="let item of filteredBulkItems">
                <div class="checkbox-wrapper">
                    <input type="checkbox" [checked]="selectedBulkItems.has(item.name)" (change)="toggleBulkItem(item.name)">
                    <span class="checkmark"></span>
                </div>
                <span class="item-name-label">{{ item.name }}</span>
            </label>
        </div>

        <div class="bulk-footer">
            <button class="bulk-btn-secondary" (click)="closeBulkModal()">Cancel</button>
            <button class="bulk-btn-primary" (click)="addBulkItems()">Add</button>
        </div>
    </div>
</div>

<!-- Attachments Modal -->
<app-attachments-modal
    *ngIf="isAttachmentsModalOpen"
    [isAttachmentsModalOpen]="isAttachmentsModalOpen"
    [isEditMode]="false"
    (closeModal)="closeAttachmentsModal()">
</app-attachments-modal>
