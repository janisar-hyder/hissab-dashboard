<div class="page-container">
    <!-- Header -->
    <div class="page-header">
        <div class="header-titles">
            <app-breadcrumbs [items]="[
                { label: 'Items', url: '/inventory/items' },
                { label: isEditMode ? 'Edit Item' : 'Add New Item' }
            ]"></app-breadcrumbs>
            <h1 class="page-title">{{ isEditMode ? 'Edit Item' : 'Add New Item' }}</h1>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs-container">
        <div class="tabs-header">
            <button *ngFor="let tab of tabs" 
                    class="tab-btn" 
                    [class.active]="activeTab === tab.id"
                    (click)="setTab(tab.id)">
                {{ tab.label }}
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="form-container">
        <!-- Basic Information Form -->
        <div class="form-card" *ngIf="activeTab === 'basic-info'">
            <div class="form-grid">
                <!-- Item ID -->
                <div class="form-group">
                    <label>Item ID <span class="required">*</span></label>
                    <input type="text" class="form-control" [value]="itemData.itemId" disabled readonly>
                </div>

                <!-- Item Name -->
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.itemName" placeholder="Enter Product Name">
                </div>

                <!-- Unit of Measure -->
                <div class="form-group">
                    <label>Unit of Measure</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.uom" 
                        [options]="uomOptions" 
                        placeholder="Select Unit">
                    </app-custom-select>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label>Category</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.category" 
                        (ngModelChange)="onCategoryChange($event)"
                        [options]="categoryOptions" 
                        placeholder="Select Category">
                    </app-custom-select>
                </div>

                <!-- Sub Category -->
                <div class="form-group">
                    <label>Sub Category</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.subCategory" 
                        [options]="subCategoryOptions" 
                        [disabled]="subCategoryOptions.length === 0"
                        placeholder="Select Sub Category">
                    </app-custom-select>
                </div>

                <!-- SKU -->
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.sku" placeholder="Enter your SKU">
                </div>

                <!-- Brand -->
                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.brands" placeholder="Enter Brand Name">
                </div>

                <!-- Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Description</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.description" placeholder="Enter Description">
                </div>
            </div>
        </div>

        <div class="form-card" *ngIf="activeTab === 'sales'">
            <div class="form-grid">
                <!-- Rate -->
                <div class="form-group">
                    <label>Rate <span class="required">*</span></label>
                    <div class="input-with-suffix">
                        <input type="number" class="form-control" [(ngModel)]="itemData.salesRate" placeholder="0.000">
                        <div class="suffix">BHD</div>
                    </div>
                </div>

                <!-- VAT Preference -->
                <div class="form-group">
                    <label>VAT Preference</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.vatPreference" 
                        [options]="vatPreferenceOptions" 
                        placeholder="Select Preference">
                    </app-custom-select>
                </div>

                <!-- Account -->
                <div class="form-group">
                    <label>Account</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.salesAccount" 
                        [options]="salesAccountOptions" 
                        placeholder="Select Account">
                    </app-custom-select>
                </div>

                <!-- Sales Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Sales Description</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.salesDescription" placeholder="Enter Sales Description">
                </div>
            </div>
        </div>

        <div class="form-card" *ngIf="activeTab === 'purchase'">
            <div class="form-grid">
                <!-- Cost Price -->
                <div class="form-group">
                    <label>Cost Price</label>
                    <div class="input-with-suffix">
                        <input type="number" class="form-control" [(ngModel)]="itemData.purchaseCost" placeholder="0.000">
                        <div class="suffix">BHD</div>
                    </div>
                </div>

                <!-- Reorder Quantity -->
                <div class="form-group">
                    <label>Reorder Quantity</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.reorderQty" placeholder="Enter Reorder Quantity">
                </div>

                <!-- Account -->
                <div class="form-group">
                    <label>Account</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.purchaseAccount" 
                        [options]="purchaseAccountOptions" 
                        placeholder="Select Account">
                    </app-custom-select>
                </div>

                <!-- Purchase Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Purchase Description</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.purchaseDescription" placeholder="Enter Purchase Description">
                </div>
            </div>
        </div>

        <div class="form-card" *ngIf="activeTab === 'inventory'">
            <div class="form-grid">
                <!-- Account -->
                <div class="form-group">
                    <label>Account</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.inventoryAccount" 
                        [options]="inventoryAccountOptions" 
                        placeholder="Select Account">
                    </app-custom-select>
                </div>

                <!-- Stock in Hand -->
                <div class="form-group">
                    <label>Stock in Hand</label>
                    <input type="number" class="form-control" [(ngModel)]="itemData.stockInHand" placeholder="0">
                </div>

                <!-- Opening Stock -->
                <div class="form-group">
                    <label>Opening Stock</label>
                    <input type="number" class="form-control" [(ngModel)]="itemData.openingStock" placeholder="0">
                </div>

                <!-- Opening Stock Value -->
                <div class="form-group">
                    <label>Opening Stock Value</label>
                    <div class="input-with-suffix">
                        <input type="number" class="form-control" [(ngModel)]="itemData.openingStockValue" step="0.001" placeholder="0.000">
                        <div class="suffix">BHD</div>
                    </div>
                </div>

                <!-- Warranty Period -->
                <div class="form-group">
                    <label>Warranty Period (In days)</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.warrantyPeriod" placeholder="Enter Days">
                </div>

                <!-- Shelf Life -->
                <div class="form-group">
                    <label>Shelf Life (In Days)</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.shelfLife" placeholder="Enter Days">
                </div>

                <!-- Vendor -->
                <div class="form-group">
                    <label>Vendor</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.vendor" 
                        [options]="vendorOptions" 
                        placeholder="Select Vendor">
                    </app-custom-select>
                </div>

                <!-- Weight Per Unit -->
                <div class="form-group">
                    <label>Weight Per Unit</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.weightPerUnit" placeholder="Enter Weight">
                </div>

                <!-- Weight UOM -->
                <div class="form-group">
                    <label>Weight UOM</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.weightUom" 
                        [options]="weightUomOptions" 
                        placeholder="Select Weight UOM">
                    </app-custom-select>
                </div>

                <!-- Valuation Method -->
                <div class="form-group">
                    <label>Valuation Method</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.valuationMethod" 
                        [options]="valuationMethodOptions" 
                        placeholder="Select Valuation Method">
                    </app-custom-select>
                </div>

                <!-- Volume Per Unit -->
                <div class="form-group">
                    <label>Volume Per Unit</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.volumePerUnit" placeholder="Enter Volume">
                </div>

                <!-- Volume UOM -->
                <div class="form-group">
                    <label>Volume UOM</label>
                    <app-custom-select 
                        [(ngModel)]="itemData.volumeUom" 
                        [options]="volumeUomOptions" 
                        placeholder="Select Volume UOM">
                    </app-custom-select>
                </div>

                <!-- Inventory Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Inventory Description</label>
                    <input type="text" class="form-control" [(ngModel)]="itemData.inventoryDescription" placeholder="Enter Inventory Description">
                </div>
            </div>
        </div>
    </div>

    <!-- Sticky Action Footer -->
    <div class="page-footer">
        <button class="footer-btn btn-cancel" (click)="cancel()">Cancel</button>
        <button class="footer-btn btn-save" (click)="save()">Save</button>
    </div>
</div>
