<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <h1 class="page-title">Quotations</h1>
        </div>
        <div class="header-actions" *ngIf="quotations().length > 0">
            <app-bulk-actions [selectedCount]="selectedQuotationIds().size" [actions]="bulkActions()"
                (actionSelected)="handleBulkAction($event)">
            </app-bulk-actions>
            <app-button variant="primary" iconPrefix="las la-plus" (clicked)="navigateToNew()">Add New
                Quotation</app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16V4M12 16L8 12M12 16L16 12" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Import
            </app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Export
            </app-button>
        </div>
    </div>

    <!-- Data Card -->
    <div class="data-card" *ngIf="quotations().length > 0 || searchQuery() || currentFilter() !== 'All'">

        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event); currentPage.set(1)">
                <i class="las la-times clear-icon" *ngIf="searchQuery()" (click)="clearSearch()"></i>
            </div>

            <div class="toolbar-right">
                <app-custom-filter
                    [options]="quotationFilterOptions"
                    [currentFilter]="currentFilter()"
                    activeLabelPrefix="All Quotations"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage
                    Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive" [class.loading]="isLoading()">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll($event)">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible">
                                {{ col.label }}
                                <i [class]="sortColumn() === col.id 
                                    ? (sortDirection() === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                    : 'las la-sort'"
                                   (click)="sort(col.id, $event)"
                                   style="cursor: pointer; margin-left: 4px;"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody *ngIf="!isLoading()">
                    <tr *ngFor="let quotation of paginatedQuotations()" class="clickable-row" (click)="navigateToInfo(quotation.id)">
                        <td class="col-checkbox" (click)="$event.stopPropagation()">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="selectedQuotationIds().has(quotation.id)"
                                    (change)="toggleSelection(quotation.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td *ngIf="col.visible" [ngSwitch]="col.id">
                                <ng-container *ngSwitchCase="'quotationNumber'">
                                    <span class="text-muted">{{ quotation.quotation_number }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'date'">
                                    <span class="text-muted">{{ quotation.quotation_date | date:'dd MMM, yyyy' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'customerName'">
                                    <span class="text-muted">{{ quotation.customer?.name }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'amount'">
                                    <span class="text-muted text-right">BHD {{ quotation.grand_total | number:'1.3-3' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="'status-' + quotation.status.toLowerCase()">
                                        <span class="dot"></span>
                                        {{ quotation.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <app-action-menu [actions]="getActions(quotation)" [data]="quotation" (actionClick)="handleAction($event)"></app-action-menu>
                        </td>
                    </tr>
                    <!-- Empty State -->
                    <tr *ngIf="paginatedQuotations().length === 0">
                        <td colspan="7" style="padding: 0;">
                            <app-empty-state 
                                [title]="emptyStateTitle()"
                                [subtitle]="emptyStateSubtitle()"
                                [actionLabel]="emptyStateActionLabel()" 
                                [actionIconClass]="emptyStateActionLabel() ? 'las la-plus' : ''" 
                                (actionClick)="navigateToNew()">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Pagination -->
        <app-pagination [totalItems]="filteredQuotations().length" [itemsPerPage]="itemsPerPage()"
            [currentPage]="currentPage()" (pageChange)="onPageChange($event)"
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <div class="loader-container" *ngIf="isLoading()">
        <div class="loading-spinner"></div>
    </div>

    <app-empty-state *ngIf="!isLoading() && quotations().length === 0 && !searchQuery() && currentFilter() === 'All'" 
        [title]="emptyStateTitle()"
        [subtitle]="emptyStateSubtitle()"
        [actionLabel]="emptyStateActionLabel()" 
        [actionIconClass]="emptyStateActionLabel() ? 'las la-plus' : ''" 
        (actionClick)="navigateToNew()">
    </app-empty-state>
</div>


<!-- Global Shared Output Models -->
<app-manage-columns pageId="quotations-list" [isOpen]="isManageColumnsOpen()" [columns]="availableColumns" (closePanel)="closeManageColumns()"
     (columnsChange)="availableColumns = $event">
</app-manage-columns>

<app-delete-modal [isOpen]="!!quotationToDelete()" title="Delete Quotation"
    [message]="bulkDeletePending() ? 'Are you sure you want to delete these quotations? This action cannot be undone.' : 'Are you sure you want to delete this quotation? This action cannot be undone.'"
    (cancel)="closeDeleteModal()" (confirm)="confirmDelete()">
</app-delete-modal>
