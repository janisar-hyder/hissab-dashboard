<!-- Data Card -->
<div class="data-card" style="margin: 0; display: flex; flex-direction: column;" *ngIf="users.length > 0 || searchQuery">
        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." [(ngModel)]="searchQuery" (ngModelChange)="currentPage = 1" class="search-input">
                <i class="las la-times clear-icon" *ngIf="searchQuery" (click)="clearSearch()"></i>
            </div>
            
            <div class="toolbar-actions" style="display: flex; gap: var(--space-sm); align-items: center;">
                <app-custom-filter
                    [options]="userFilterOptions"
                    [currentFilter]="currentFilter"
                    activeLabelPrefix="All Users"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" 
                                       [checked]="isAllSelected()" 
                                       [indeterminate]="isPartiallySelected()"
                                       (change)="toggleAll($event)">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible" [class.col-status]="col.id === 'status'">
                                {{ col.label }} 
                                <i [class]="sortColumn === col.id ? (sortDirection === 'asc' ? 'las la-sort-up' : 'las la-sort-down') : 'las la-sort'" 
                                   (click)="sort(col.id, $event)"
                                   style="cursor: pointer; margin-left: 4px;"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of paginatedUsers">
                        <td class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" 
                                       [checked]="selectedUserIds.has(user.id)" 
                                       (change)="toggleSelection(user.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td *ngIf="col.visible" [ngSwitch]="col.id" [class.col-status]="col.id === 'status'" class="text-muted">
                                <ng-container *ngSwitchCase="'name'">
                                    <span style="color: var(--text-dark); font-weight: 500;">{{ user.name }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'role'">{{ user.role }}</ng-container>
                                <ng-container *ngSwitchCase="'email'">{{ user.email }}</ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="user.status.toLowerCase()">
                                        <span class="dot"></span> {{ user.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <app-action-menu
                                [actions]="getUserActions(user)"
                                [data]="user"
                                (actionClick)="handleUserAction($event)">
                            </app-action-menu>
                        </td>
                    </tr>
                    <!-- Internal Empty State (No Results found inside table) -->
                    <tr *ngIf="paginatedUsers.length === 0">
                        <td [attr.colspan]="availableColumns.length + 2" style="padding: 0;">
                            <app-empty-state 
                                [title]="(searchQuery || currentFilter !== 'All') ? 'No Users Found.' : 'No Users Found.'"
                                [subtitle]="searchQuery ? 'We couldn\'t find any users matching \'' + searchQuery + '\'' : 'It looks like you haven\'t added any users yet.'" 
                                [actionLabel]="(searchQuery || currentFilter !== 'All') ? '' : 'Add New User'"
                                [actionIconClass]="(searchQuery || currentFilter !== 'All') ? '' : 'las la-plus'" 
                                (actionClick)="navigateToNew()">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>


        <!-- Footer Pagination -->
        <app-pagination 
            [totalItems]="filteredUsers.length" 
            [itemsPerPage]="itemsPerPage" 
            [currentPage]="currentPage"
            (pageChange)="onPageChange($event)" 
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <app-empty-state *ngIf="users.length === 0 && !searchQuery" 
        title="No Users Found."
        subtitle="It looks like you haven't added any users yet." 
        actionLabel="Add New User"
        actionIconClass="las la-plus" 
        (actionClick)="navigateToNew()">
    </app-empty-state>

<!-- Manage Columns Side Panel -->
<app-manage-columns 
    [isOpen]="isManageColumnsOpen" 
    [columns]="availableColumns" 
    (closePanel)="closeManageColumns()"
    (columnsChange)="onColumnsChange($event)">
</app-manage-columns>

<!-- Delete Confirmation Modal -->
<app-delete-modal 
    [isOpen]="!!userToDelete || bulkDeletePending" 
    [title]="bulkDeletePending ? 'Delete Users' : 'Delete User'"
    [message]="bulkDeletePending 
        ? 'Are you sure you want to delete ' + selectedUserIds.size + ' selected user(s)? This action cannot be undone.'
        : 'Are you sure you want to delete this user? This action cannot be undone.'" 
    (cancel)="closeDeleteModal()"
    (confirm)="confirmDelete()">
</app-delete-modal>

<!-- Add New User Modal -->
<app-add-user-modal 
    *ngIf="isAddUserModalOpen" 
    (close)="isAddUserModalOpen = false" 
    (save)="onSaveUser($event)">
</app-add-user-modal>
