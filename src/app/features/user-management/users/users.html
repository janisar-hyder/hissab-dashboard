<!-- Data Card -->
<div class="data-card" style="margin: 0; display: flex; flex-direction: column;" *ngIf="users.length > 0">
        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input">
                <i class="las la-times clear-icon"></i>
            </div>
            
            <div class="toolbar-actions" style="display: flex; gap: var(--space-sm); align-items: center;">
                <div class="custom-dropdown" style="position: relative;">
                    <button class="dropdown-trigger" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: white; border: 1px solid var(--border-light); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer;">
                        All Users
                        <i class="las la-angle-down"></i>
                    </button>
                </div>
                
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <input type="checkbox" [checked]="isAllSelected()" (change)="toggleAll()">
                        </th>
                        <th *ngIf="isColumnVisible('name')">Name <i class="las la-sort"></i></th>
                        <th *ngIf="isColumnVisible('role')">Role <i class="las la-sort"></i></th>
                        <th *ngIf="isColumnVisible('email')">Email <i class="las la-sort"></i></th>
                        <th *ngIf="isColumnVisible('status')">Status <i class="las la-sort"></i></th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of paginatedUsers">
                        <td class="col-checkbox">
                            <input type="checkbox" [checked]="selectedUserIds.has(user.id)" (change)="toggleSelection(user.id)">
                        </td>
                        <td class="text-muted" *ngIf="isColumnVisible('name')">{{ user.name }}</td>
                        <td class="text-muted" *ngIf="isColumnVisible('role')">{{ user.role }}</td>
                        <td class="text-muted" *ngIf="isColumnVisible('email')">{{ user.email }}</td>
                        <td *ngIf="isColumnVisible('status')">
                            <span class="status-pill" [ngClass]="user.status.toLowerCase()">
                                <span class="dot"></span> {{ user.status }}
                            </span>
                        </td>
                        <td class="col-actions">
                            <app-action-menu 
                                [actions]="getUserActions(user)" 
                                [data]="user"
                                (actionClick)="handleUserAction($event)">
                            </app-action-menu>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Pagination -->
        <app-pagination 
            [totalItems]="users.length" 
            [itemsPerPage]="itemsPerPage" 
            [currentPage]="currentPage"
            (pageChange)="onPageChange($event)" 
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <app-empty-state *ngIf="users.length === 0" 
        title="No Users Found."
        subtitle="It looks like you haven't added any users yet." 
        actionLabel="Add New User"
        actionIconClass="las la-plus" 
        (actionClick)="navigateToNew()">
    </app-empty-state>

<!-- Manage Columns Side Panel -->
<app-manage-columns 
    [isOpen]="isManageColumnsOpen" 
    [columns]="availableColumns" 
    (closePanel)="closeManageColumns()"
    (columnsChange)="onColumnsChange($event)">
</app-manage-columns>

<!-- Delete Confirmation Modal -->
<app-delete-modal 
    [isOpen]="!!userToDelete" 
    title="Delete User"
    message="Are you sure you want to delete this user? This action cannot be undone." 
    (cancel)="closeDeleteModal()"
    (confirm)="confirmDelete()">
</app-delete-modal>

<!-- Add New User Modal -->
<app-add-user-modal 
    *ngIf="isAddUserModalOpen" 
    (close)="isAddUserModalOpen = false" 
    (save)="onSaveUser($event)">
</app-add-user-modal>
