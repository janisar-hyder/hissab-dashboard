<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <h1 class="page-title">Invoices</h1>
        </div>
        <div class="header-actions" *ngIf="invoices.length > 0">
            <app-bulk-actions [selectedCount]="selectedInvoiceIds.size" [actions]="bulkActions"
                (actionSelected)="handleBulkAction($event)">
            </app-bulk-actions>
            <app-button variant="primary" iconPrefix="las la-plus" (clicked)="navigateToNew()">Add New
                Invoice</app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16V4M12 16L8 12M12 16L16 12" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Import
            </app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Export
            </app-button>
        </div>
    </div>

    <!-- Data Card -->
    <div class="data-card" *ngIf="invoices.length > 0">

        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input">
                <i class="las la-times clear-icon"></i>
            </div>

            <div class="toolbar-right">
                <app-custom-filter
                    [options]="invoiceFilterOptions"
                    [currentFilter]="currentFilter"
                    activeLabelPrefix="All Invoices"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage
                    Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <input type="checkbox" [checked]="isAllSelected()" (change)="toggleAll()">
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible" [ngSwitch]="col.id" [class.text-right]="col.id === 'amount' || col.id === 'balanceDue'">
                                <ng-container *ngSwitchDefault>{{ col.label }}</ng-container>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let invoice of paginatedInvoices" class="clickable-row" (click)="navigateToInfo(invoice.id)">
                        <td class="col-checkbox" (click)="$event.stopPropagation()">
                            <input type="checkbox" [checked]="selectedInvoiceIds.has(invoice.id)"
                                (change)="toggleSelection(invoice.id)">
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td *ngIf="col.visible" [ngSwitch]="col.id" [class.text-right]="col.id === 'amount' || col.id === 'balanceDue'">
                                <ng-container *ngSwitchCase="'invoiceNumber'">
                                    <span class="text-muted">{{ invoice.invoiceNumber }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'date'">
                                    <span class="text-muted">{{ invoice.date }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'customerName'">
                                    <span class="text-muted">{{ invoice.customerName }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'dueDate'">
                                    <span class="text-muted">{{ invoice.dueDate }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'amount'">
                                    <span class="text-muted">BHD {{ invoice.amount | number:'1.3-3' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'balanceDue'">
                                    <span class="text-muted">BHD {{ invoice.balanceDue | number:'1.3-3' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="'status-' + invoice.status.toLowerCase().split(' ').join('-').replace(/[0-9]/g, '').replace('--', '-')">
                                        <span class="dot"></span>
                                        {{ invoice.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <div class="action-menu-container">
                                <button class="action-btn" (click)="toggleMenu(invoice.id, $event)"><i
                                        class="las la-ellipsis-h"></i></button>

                                <div class="action-dropdown" *ngIf="openMenuId === invoice.id">
                                    <button class="menu-item edit-btn"
                                        (click)="navigateToEdit(invoice.id, $event)">Edit</button>
                                    <button class="menu-item delete-btn" (click)="openDeleteModal(invoice, $event)">
                                        <div class="svg-icon"
                                            style="-webkit-mask-image: url('/icons/delete.svg'); mask-image: url('/icons/delete.svg');">
                                        </div>
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Pagination -->
        <app-pagination [totalItems]="filteredInvoices.length" [itemsPerPage]="itemsPerPage"
            [currentPage]="currentPage" (pageChange)="onPageChange($event)"
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <app-empty-state *ngIf="filteredInvoices.length === 0" title="No Invoices Found."
        subtitle="It looks like you haven't added any invoices matching this filter yet."
        actionLabel="Add New Invoice" actionIconClass="las la-plus" (actionClick)="navigateToNew()">
    </app-empty-state>

</div>

<!-- Global Shared Output Models -->
<app-manage-columns [isOpen]="isManageColumnsOpen" [columns]="availableColumns" (closePanel)="closeManageColumns()"
    (columnsChange)="onColumnsChange($event)">
</app-manage-columns>

<app-delete-modal [isOpen]="!!invoiceToDelete" title="Delete Invoice"
    message="Are you sure you want to delete this invoice? This action cannot be undone."
    (cancel)="closeDeleteModal()" (confirm)="confirmDelete()">
</app-delete-modal>
