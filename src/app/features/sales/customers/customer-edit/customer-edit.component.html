<div class="page-container">
    <div class="page-header">
        <div class="header-titles">
            <app-breadcrumbs [items]="[
                { label: 'Customers', url: '/sales/customers' },
                { label: isEditMode ? 'Edit Customer' : 'Add New Customer' }
            ]"></app-breadcrumbs>
            <h1 class="page-title">{{ isEditMode ? 'Edit Customer' : 'Add New Customer' }}</h1>
        </div>
        <div class="header-actions">
            <app-button variant="outline" (clicked)="openAttachmentsModal()">
                <svg svg-icon style="margin-right: 8px;" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 20 20" fill="none">
                    <g clip-path="url(#clip0_1_19699)">
                        <mask id="mask0_1_19699" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0"
                            width="20" height="20">
                            <path d="M20 0H0V20H20V0Z" fill="white" />
                        </mask>
                        <g mask="url(#mask0_1_19699)">
                            <path
                                d="M10.2752 17.7837C9.36683 17.7837 8.4585 17.442 7.76686 16.7503C6.38353 15.367 6.38353 13.1253 7.76686 11.742L9.8335 9.68367C10.0752 9.442 10.4752 9.442 10.7168 9.68367C10.9585 9.92533 10.9585 10.3253 10.7168 10.567L8.65016 12.6253C7.75853 13.517 7.75853 14.9753 8.65016 15.867C9.54183 16.7587 11.0002 16.7587 11.8918 15.867L15.1335 12.6253C16.1168 11.642 16.6585 10.3337 16.6585 8.942C16.6585 7.55029 16.1168 6.24196 15.1335 5.25863C13.1002 3.22529 9.80016 3.22529 7.76686 5.25863L4.23353 8.792C3.40853 9.617 2.9502 10.717 2.9502 11.8837C2.9502 13.0503 3.40853 14.1503 4.23353 14.9753C4.4752 15.217 4.4752 15.617 4.23353 15.8587C3.99186 16.1003 3.59186 16.1003 3.3502 15.8587C2.29186 14.792 1.7002 13.3837 1.7002 11.8837C1.7002 10.3837 2.28353 8.967 3.3502 7.90863L6.88353 4.37529C9.40016 1.85863 13.5002 1.85863 16.0168 4.37529C17.2335 5.59196 17.9085 7.21696 17.9085 8.942C17.9085 10.667 17.2335 12.292 16.0168 13.5087L12.7752 16.7503C12.0835 17.442 11.1835 17.7837 10.2752 17.7837Z"
                                fill="#646569" />
                        </g>
                    </g>
                    <defs>
                        <clipPath id="clip0_1_19699">
                            <rect width="20" height="20" fill="white" />
                        </clipPath>
                    </defs>
                </svg>
                {{ isEditMode ? 'Attachments' : 'Attach Documents' }}
            </app-button>
        </div>
    </div>


    <div class="form-container">
        <!-- Tabbed Section -->
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-btn" [class.active]="activeTab === 'customer-info'"
                    (click)="setTab('customer-info')">Customer Information</button>
                <button class="tab-btn" [class.active]="activeTab === 'additional'"
                    (click)="setTab('additional')">Additional Information</button>
                <button class="tab-btn" [class.active]="activeTab === 'address'"
                    (click)="setTab('address')">Address</button>
                <button class="tab-btn" [class.active]="activeTab === 'contacts'" (click)="setTab('contacts')">Contact
                    persons</button>
                <button class="tab-btn" [class.active]="activeTab === 'remarks'"
                    (click)="setTab('remarks')">Remarks</button>
            </div>

            <div class="tab-content">
                <!-- Customer Information Tab -->
                <div class="form-card" *ngIf="activeTab === 'customer-info'">
                    <div class="form-grid" style="grid-template-columns: repeat(3, 1fr);">
                        <!-- Customer Name -->
                        <div class="form-group">
                            <label>Customer Name <span class="required">*</span></label>
                            <input type="text" class="form-control" [value]="isEditMode ? 'Young Supply Co.' : ''"
                                placeholder="Enter Customer Name">
                        </div>

                        <!-- Customer Type -->
                        <div class="form-group">
                            <label>Customer Type</label>
                            <select class="form-control custom-select">
                                <option *ngIf="!isEditMode" disabled selected>Select Customer Type</option>
                                <option *ngIf="isEditMode" selected>Business</option>
                            </select>
                        </div>

                        <!-- Primary Contact -->
                        <div class="form-group">
                            <label>Primary Contact</label>
                            <input type="text" class="form-control" [value]="isEditMode ? 'Ahmed Ali' : ''"
                                placeholder="Enter Primary Contact">
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label>Email</label>
                            <div class="input-with-icon">
                                <i class="las la-at input-icon"></i>
                                <input type="email" class="form-control pl-icon" [value]="isEditMode ? 'enter your email' : ''"
                                    placeholder="Enter your Email">
                            </div>
                        </div>

                        <!-- Phone Number -->
                        <div class="form-group">
                            <label>Phone Number</label>
                            <div class="phone-input">
                                <div class="flag-prefix">
                                    <span class="flag-bh"></span> +973 <i class="las la-angle-down"></i>
                                </div>
                                <input type="tel" class="form-control" [value]="isEditMode ? '1798 6489' : ''"
                                    placeholder="Enter Phone Number">
                            </div>
                        </div>

                        <!-- Mobile Number -->
                        <div class="form-group">
                            <label>Mobile Number</label>
                            <div class="phone-input">
                                <div class="flag-prefix">
                                    <span class="flag-bh"></span> +973 <i class="las la-angle-down"></i>
                                </div>
                                <input type="tel" class="form-control" [value]="isEditMode ? '3258 4290' : ''"
                                    placeholder="Enter Mobile Number">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Additional Information Tab -->
                <div class="tabs-grid" *ngIf="activeTab === 'additional'">
                    <!-- Tax Treatment -->
                    <div class="form-group">
                        <label>Tax Treatment <span class="required">*</span></label>
                        <select class="form-control custom-select">
                            <option *ngIf="!isEditMode" disabled selected>Select Tax Treatment</option>
                            <option *ngIf="isEditMode" selected>VAT Registered</option>
                        </select>
                    </div>
                    <!-- Currency -->
                    <div class="form-group">
                        <label>Currency</label>
                        <select class="form-control custom-select">
                            <option>BHD- Bahraini Dinar</option>
                        </select>
                    </div>
                    <!-- Opening Balance -->
                    <div class="form-group">
                        <label>Opening Balance</label>
                        <div class="input-with-suffix">
                            <input type="text" class="form-control pr-suffix" [value]="isEditMode ? '321' : '0'">
                            <span class="input-suffix">BHD</span>
                        </div>
                    </div>

                    <!-- Source of Supply -->
                    <div class="form-group">
                        <label>Source of Supply <span class="required">*</span></label>
                        <select class="form-control custom-select">
                            <option *ngIf="!isEditMode" disabled selected>Select Source of Supply</option>
                            <option *ngIf="isEditMode" selected>Riffa</option>
                        </select>
                    </div>
                    <!-- Payment Terms -->
                    <div class="form-group">
                        <label>Payment Terms</label>
                        <select class="form-control custom-select">
                            <option>Due On Receipt</option>
                        </select>
                    </div>
                </div>

                <!-- Address Tab -->
                <div class="address-tab-layout" *ngIf="activeTab === 'address'">
                    <!-- Billing Address Column -->
                    <div class="address-column form-card">
                        <div class="address-header">
                            <h2 class="card-title">Billing Address</h2>
                        </div>
                        <div class="address-grid">
                            <div class="form-group">
                                <label>Attention</label>
                                <input type="text" class="form-control" #billingAttention
                                    [value]="isEditMode ? 'John Doe' : ''"
                                    placeholder="Enter Name">
                            </div>
                            <div class="form-group">
                                <label>Country / Region</label>
                                <select class="form-control custom-select" #billingCountry>
                                    <option selected>Bahrain</option>
                                    <option>United Arab Emirates</option>
                                    <option>Saudi Arabia</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <textarea class="form-control" rows="3" #billingAddress
                                    placeholder="Enter Address">{{ isEditMode ? '123 Business Rd, Manama' : '' }}</textarea>
                            </div>
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" class="form-control" #billingCity
                                    [value]="isEditMode ? 'Manama' : ''"
                                    placeholder="Enter City">
                            </div>
                        </div>
                    </div>

                    <!-- Shipment Address Column -->
                    <div class="address-column form-card">
                        <div class="address-header shipment-header">
                            <h2 class="card-title">Shipment Address</h2>
                            <label class="custom-checkbox">
                                <input type="checkbox" [(ngModel)]="sameAsBilling"
                                    (change)="onSameAsBillingChange(billingAttention.value, billingCountry.value, billingAddress.value, billingCity.value)">
                                <span class="checkmark"></span>
                                <span class="checkbox-label text-muted">Same as Billing Address</span>
                            </label>
                        </div>
                        <div class="address-grid">
                            <div class="form-group">
                                <label>Attention</label>
                                <input type="text" class="form-control"
                                    [value]="sameAsBilling ? shipmentAddress.attention : (isEditMode ? 'Jane Doe' : '')"
                                    placeholder="Enter Name">
                            </div>
                            <div class="form-group">
                                <label>Country / Region</label>
                                <select class="form-control custom-select">
                                    <option [selected]="sameAsBilling ? shipmentAddress.country === 'Bahrain' : true">Bahrain</option>
                                    <option>United Arab Emirates</option>
                                    <option>Saudi Arabia</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <textarea class="form-control" rows="3"
                                    placeholder="Enter Address">{{ sameAsBilling ? shipmentAddress.address : (isEditMode ? 'Building 45, Seef District' : '') }}</textarea>
                            </div>
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" class="form-control"
                                    [value]="sameAsBilling ? shipmentAddress.city : (isEditMode ? 'Seef' : '')"
                                    placeholder="Enter City">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contact Persons Tab -->
                <div class="contacts-tab-layout" *ngIf="activeTab === 'contacts'">
                    <div class="form-card p-0">
                        <div class="contacts-table">
                            <div class="contacts-thead">
                                <div class="contacts-th">Salutation</div>
                                <div class="contacts-th">First Name</div>
                                <div class="contacts-th">Last Name</div>
                                <div class="contacts-th">Email Address</div>
                                <div class="contacts-th">Phone number</div>
                                <div class="contacts-th">Designation</div>
                                <div class="contacts-th action-th"></div>
                            </div>
                            <div class="contacts-tbody">
                                <div class="contacts-tr">
                                    <div class="contacts-td">
                                        <select class="form-control custom-select">
                                            <option disabled selected>Select</option>
                                        </select>
                                    </div>
                                    <div class="contacts-td">
                                        <input type="text" class="form-control" placeholder="First Name">
                                    </div>
                                    <div class="contacts-td">
                                        <input type="text" class="form-control" placeholder="Last Name">
                                    </div>
                                    <div class="contacts-td">
                                        <input type="email" class="form-control" placeholder="Email Address">
                                    </div>
                                    <div class="contacts-td">
                                        <div class="phone-input compact">
                                            <div class="flag-prefix">
                                                <span class="flag-bh"></span> +973 <i class="las la-angle-down"></i>
                                            </div>
                                            <input type="tel" class="form-control" placeholder="Number">
                                        </div>
                                    </div>
                                    <div class="contacts-td">
                                        <input type="text" class="form-control" placeholder="Designation">
                                    </div>
                                    <div class="contacts-td action-td">
                                        <button class="icon-btn delete-btn">
                                            <svg width="18" height="20" viewBox="0 0 18 20" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path d="M1 4.5H17" stroke="#D1D5DB" stroke-width="1.5"
                                                    stroke-linecap="round" stroke-linejoin="round" />
                                                <path
                                                    d="M16 4.5V17.5C16 18.0304 15.7893 18.5391 15.4142 18.9142C15.0391 19.2893 14.5304 19.5 14 19.5H4C3.46957 19.5 2.96086 19.2893 2.58579 18.9142C2.21071 18.5391 2 18.0304 2 17.5V4.5M5 4.5V2.5C5 1.96957 5.21071 1.46086 5.58579 1.08579C5.96086 0.710714 6.46957 0.5 7 0.5H11C11.5304 0.5 12.0391 0.710714 12.4142 1.08579C12.7893 1.46086 13 1.96957 13 2.5V4.5"
                                                    stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"
                                                    stroke-linejoin="round" />
                                                <path d="M7 9.5V14.5" stroke="#D1D5DB" stroke-width="1.5"
                                                    stroke-linecap="round" stroke-linejoin="round" />
                                                <path d="M11 9.5V14.5" stroke="#D1D5DB" stroke-width="1.5"
                                                    stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="add-action-row">
                            <button class="add-link-btn">
                                <i class="las la-plus"></i> Add Contact Person
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Remarks Tab -->
                <div class="remarks-tab-layout" *ngIf="activeTab === 'remarks'">
                    <div class="form-card">
                        <div class="form-group">
                            <label>Remarks (For internal Use)</label>
                            <textarea class="form-control" rows="8"
                                placeholder="Enter Remarks">{{ isEditMode ? 'VIP customer since 2021. Requires priority support.' : '' }}</textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="page-footer">
        <button class="footer-btn btn-cancel" (click)="goBack()">Cancel</button>
        <button class="footer-btn btn-save" (click)="goBack()">{{ isEditMode ? 'Save & Update' : 'Save' }}</button>
    </div>
</div>

<!-- Attachments Modal -->
<app-attachments-modal
    *ngIf="isAttachmentsModalOpen"
    [isAttachmentsModalOpen]="isAttachmentsModalOpen"
    [isEditMode]="isEditMode"
    (closeModal)="closeAttachmentsModal()">
</app-attachments-modal>
