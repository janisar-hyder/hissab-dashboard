<div class="page-container">
    <app-breadcrumbs [items]="[
        { label: 'Settings', url: '/settings' },
        { label: 'Unit of Measures' }
    ]"></app-breadcrumbs>

    <app-page-header
        style="margin-bottom: var(--space-lg); display: block;"
        title="Unit of Measures"
        addBtnText="Add New UOM"
        [showActions]="true"
        (addNew)="isAddModalOpen = true">

        <app-bulk-actions
            custom-actions
            *ngIf="selectedUomIds.size > 0"
            [selectedCount]="selectedUomIds.size"
            [actions]="bulkActions"
            (actionSelected)="handleBulkAction($event)">
        </app-bulk-actions>
    </app-page-header>

    <div class="data-card" style="margin: 0; display: flex; flex-direction: column;" *ngIf="uoms.length > 0 || searchQuery">
        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" 
                       [(ngModel)]="searchQuery" 
                       (ngModelChange)="currentPage = 1"
                       placeholder="Search for something.." 
                       class="search-input">
                <i *ngIf="searchQuery" class="las la-times clear-icon" (click)="clearSearch()"></i>
            </div>
            
            <div class="toolbar-actions" style="display: flex; gap: var(--space-sm); align-items: center;">
                <app-custom-filter 
                    [options]="filterOptions" 
                    [currentFilter]="currentFilter"
                    activeLabelPrefix="All UOMs"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll()">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible" [class.col-status]="col.id === 'status'">
                                {{ col.label }}
                                <i [class]="sortColumn === col.id ? (sortDirection === 'asc' ? 'las la-sort-up' : 'las la-sort-down') : 'las la-sort'" 
                                   (click)="sort(col.id, $event)"
                                   style="cursor: pointer; margin-left: 4px;"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let uom of paginatedUoms">
                        <td class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="selectedUomIds.has(uom.id)" (change)="toggleSelection(uom.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td *ngIf="col.visible" [ngSwitch]="col.id" [class.col-status]="col.id === 'status'" class="text-muted">
                                <ng-container *ngSwitchCase="'name'">
                                    <span class="item-name">{{ uom.name }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="uom.status.toLowerCase()">
                                        <span class="dot"></span> {{ uom.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <app-action-menu [actions]="getActions(uom)" [data]="uom" (actionClick)="handleAction($event)"></app-action-menu>
                        </td>
                    </tr>
                    <!-- Empty Search State -->
                    <tr *ngIf="paginatedUoms.length === 0">
                        <td [attr.colspan]="availableColumns.length + 2" style="padding: 0;">
                            <app-empty-state 
                                [title]="(searchQuery || currentFilter !== 'All') ? 'No Unit of Measures Found.' : 'No Unit of Measures Found.'"
                                [subtitle]="searchQuery ? 'We couldn\'t find any unit of measures matching \'' + searchQuery + '\'' : 'It looks like you haven\'t added any unit of measures yet.'" 
                                [actionLabel]="(searchQuery || currentFilter !== 'All') ? '' : 'Add New UOM'"
                                [actionIconClass]="(searchQuery || currentFilter !== 'All') ? '' : 'las la-plus'" 
                                (actionClick)="isAddModalOpen = true">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <app-pagination 
            [totalItems]="filteredUoms.length" 
            [itemsPerPage]="itemsPerPage" 
            [currentPage]="currentPage"
            (pageChange)="onPageChange($event)" 
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <!-- Initial Empty State -->
    <app-empty-state 
        *ngIf="uoms.length === 0 && !searchQuery"
        title="No Unit of Measures Found."
        subtitle="It looks like you haven't added any unit of measures yet." 
        actionLabel="Add New UOM"
        actionIconClass="las la-plus" 
        (actionClick)="isAddModalOpen = true">
    </app-empty-state>
</div>

<!-- Modal -->
<app-add-uom-modal 
    *ngIf="isAddModalOpen" 
    (close)="isAddModalOpen = false" 
    (save)="onSaveUom($event)">
</app-add-uom-modal>

<!-- Delete Confirmation -->
<app-delete-modal 
    [isOpen]="!!uomToDelete || bulkDeletePending" 
    [title]="bulkDeletePending ? 'Delete Unit of Measures' : 'Delete Unit of Measure'"
    [message]="bulkDeletePending 
        ? 'Are you sure you want to delete ' + selectedUomIds.size + ' selected units? This action cannot be undone.'
        : 'Are you sure you want to delete this unit of measure? This action cannot be undone.'" 
    (cancel)="uomToDelete = null; bulkDeletePending = false"
    (confirm)="confirmDelete()">
</app-delete-modal>

<!-- Manage Columns -->
<app-manage-columns 
    [isOpen]="isManageColumnsOpen"
    [columns]="availableColumns"
    (columnsChange)="onColumnsChange($event)"
    (closePanel)="closeManageColumns()">
</app-manage-columns>
