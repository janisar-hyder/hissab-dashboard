<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Settings</h1>
        <div class="search-box">
            <i class="las la-search search-icon"></i>
            <input type="text" placeholder="Search for something.." [(ngModel)]="searchQuery" class="search-input">
            <i class="las la-times clear-icon" *ngIf="searchQuery" (click)="clearSearch()"></i>
        </div>
    </div>

    <div class="settings-grid" *ngIf="filteredCategories.length > 0; else noResults">
        <div *ngFor="let category of filteredCategories" class="category-card">
            <div class="card-header">
                <h3 class="category-title">{{ category.title }}</h3>
            </div>
            <div class="card-body">
                <ul class="sub-links">
                    <li *ngFor="let link of category.links">
                        <a [routerLink]="link.route" class="sub-link">
                            {{ link.label }}
                            <span class="external-icon">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <ng-template #noResults>
        <app-empty-state 
            title="No matching settings found"
            [subtitle]="'We couldn\'t find any settings matching \'' + searchQuery + '\''" 
            actionLabel="Clear Search"
            actionIconClass="las la-times" 
            (actionClick)="clearSearch()">
        </app-empty-state>
    </ng-template>
</div>
