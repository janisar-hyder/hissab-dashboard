<div class="page-container">
    <!-- Header -->
    <div class="page-header">
        <div class="header-titles">
            <app-breadcrumbs [items]="[
                { label: 'Items', url: '/inventory/items' },
                { label: 'Add New Item' }
            ]"></app-breadcrumbs>
            <h1 class="page-title">Add New Item</h1>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs-container">
        <div class="tabs-header">
            <button *ngFor="let tab of tabs" 
                    class="tab-btn" 
                    [class.active]="activeTab === tab.id"
                    (click)="setTab(tab.id)">
                {{ tab.label }}
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="form-container">
        <!-- Basic Information Form -->
        <div class="form-card" *ngIf="activeTab === 'basic-info'">
            <div class="form-grid">
                <!-- Item ID -->
                <div class="form-group">
                    <label>Item ID <span class="required">*</span></label>
                    <input type="text" class="form-control" value="ITM-001" disabled readonly>
                </div>

                <!-- Item Name -->
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" class="form-control" placeholder="Enter Product Name">
                </div>

                <!-- Unit of Measure -->
                <div class="form-group">
                    <label>Unit of Measure</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Unit</option>
                            <option value="pcs">Pcs</option>
                            <option value="unit">Unit</option>
                            <option value="hour">Hour</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label>Category</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Category</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                            <option value="service">Service</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Sub Category -->
                <div class="form-group">
                    <label>Sub Category</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Sub Category</option>
                            <option value="laptops">Laptops</option>
                            <option value="servers">Servers</option>
                            <option value="networking">Networking</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- SKU -->
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" class="form-control" placeholder="Enter your SKU">
                </div>

                <!-- Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Description</label>
                    <input type="text" class="form-control" placeholder="Enter Description">
                </div>
            </div>
        </div>

        <div class="form-card" *ngIf="activeTab === 'sales'">
            <div class="form-grid">
                <!-- Rate -->
                <div class="form-group">
                    <label>Rate <span class="required">*</span></label>
                    <div class="input-with-suffix">
                        <input type="text" class="form-control" placeholder="0.000">
                        <div class="suffix">BHD</div>
                    </div>
                </div>

                <!-- VAT Preference -->
                <div class="form-group">
                    <label>VAT Preference</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Preference</option>
                            <option value="taxable">Taxable</option>
                            <option value="non-taxable">Non-Taxable</option>
                            <option value="exempt">Exempt</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Account -->
                <div class="form-group">
                    <label>Account</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Account</option>
                            <option value="sales">Sales</option>
                            <option value="discount">Discount</option>
                            <option value="general-income">General Income</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Sales Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Sales Description</label>
                    <input type="text" class="form-control" placeholder="Enter Sales Description">
                </div>
            </div>
        </div>

        <div class="form-card" *ngIf="activeTab === 'purchase'">
            <div class="form-grid">
                <!-- Cost Price -->
                <div class="form-group">
                    <label>Cost Price</label>
                    <div class="input-with-suffix">
                        <input type="text" class="form-control" placeholder="0.000">
                        <div class="suffix">BHD</div>
                    </div>
                </div>

                <!-- Reorder Quantity -->
                <div class="form-group">
                    <label>Reorder Quantity</label>
                    <input type="text" class="form-control" placeholder="Enter Reorder Quantity">
                </div>

                <!-- Account -->
                <div class="form-group">
                    <label>Account</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Account</option>
                            <option value="cost-of-goods-sold">Cost of Goods Sold</option>
                            <option value="inventory-asset">Inventory Asset</option>
                            <option value="expense">Expense</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Purchase Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Purchase Description</label>
                    <input type="text" class="form-control" placeholder="Enter Purchase Description">
                </div>
            </div>
        </div>

        <div class="form-card" *ngIf="activeTab === 'inventory'">
            <div class="form-grid">
                <!-- Account -->
                <div class="form-group">
                    <label>Account</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Account</option>
                            <option value="inventory">Inventory Asset</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Warranty Period -->
                <div class="form-group">
                    <label>Warranty Period (In days)</label>
                    <input type="text" class="form-control" placeholder="Enter Days">
                </div>

                <!-- Shelf Life -->
                <div class="form-group">
                    <label>Shelf Life (In Days)</label>
                    <input type="text" class="form-control" placeholder="Enter Days">
                </div>

                <!-- Vendor -->
                <div class="form-group">
                    <label>Vendor</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Vendor</option>
                            <option value="vendor-1">Vendor 1</option>
                            <option value="vendor-2">Vendor 2</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Weight Per Unit -->
                <div class="form-group">
                    <label>Weight Per Unit</label>
                    <input type="text" class="form-control" placeholder="Enter Weight">
                </div>

                <!-- Weight UOM -->
                <div class="form-group">
                    <label>Weight UOM</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Weight UOM</option>
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="lb">lb</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Valuation Method -->
                <div class="form-group">
                    <label>Valuation Method</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Valuation Method</option>
                            <option value="fifo">FIFO</option>
                            <option value="lifo">LIFO</option>
                            <option value="average">Average Cost</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Volume Per Unit -->
                <div class="form-group">
                    <label>Volume Per Unit</label>
                    <input type="text" class="form-control" placeholder="Enter Volume">
                </div>

                <!-- Volume UOM -->
                <div class="form-group">
                    <label>Volume UOM</label>
                    <div class="custom-select-wrapper">
                        <select class="form-control" style="appearance: none;">
                            <option value="" disabled selected>Select Volume UOM</option>
                            <option value="l">L</option>
                            <option value="ml">ml</option>
                            <option value="gal">gal</option>
                        </select>
                        <i class="las la-angle-down select-icon"></i>
                    </div>
                </div>

                <!-- Inventory Description (Full Width) -->
                <div class="form-group full-width">
                    <label>Inventory Description</label>
                    <input type="text" class="form-control" placeholder="Enter Inventory Description">
                </div>
            </div>
        </div>
    </div>

    <!-- Sticky Action Footer -->
    <div class="page-footer">
        <button class="footer-btn btn-cancel" (click)="cancel()">Cancel</button>
        <button class="footer-btn btn-save" (click)="save()">Save</button>
    </div>
</div>
