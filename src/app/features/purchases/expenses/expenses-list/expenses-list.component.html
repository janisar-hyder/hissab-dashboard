<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <h1 class="page-title">Expenses</h1>
        </div>
        <div class="header-actions" *ngIf="expenses.length > 0">
            <app-bulk-actions [selectedCount]="selectedExpenseIds.size" [actions]="bulkActions"
                (actionSelected)="handleBulkAction($event)">
            </app-bulk-actions>
            <app-button variant="primary" iconPrefix="las la-plus" (clicked)="navigateToNew()">Add New
                Expense</app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16V4M12 16L8 12M12 16L16 12" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Import
            </app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Export
            </app-button>
        </div>
    </div>

    <!-- Data Card -->
    <div class="data-card" *ngIf="expenses.length > 0 || searchQuery">

        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input" [(ngModel)]="searchQuery" (ngModelChange)="currentPage = 1">
                <i class="las la-times clear-icon" *ngIf="searchQuery" (click)="clearSearch()"></i>
            </div>
            <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage
                Columns</app-button>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll($event)">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible" [class]="col.id + '-col'">
                                {{ col.label }}
                                <i [class]="sortColumn === col.id 
                                    ? (sortDirection === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                    : 'las la-sort'"
                                   (click)="sort(col.id, $event)"
                                   style="cursor: pointer; margin-left: 4px;"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let expense of paginatedExpenses" [class.selected]="selectedExpenseIds.has(expense.id)">
                        <td class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="selectedExpenseIds.has(expense.id)"
                                    (change)="toggleSelection(expense.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td class="text-muted" *ngIf="col.visible" [ngSwitch]="col.id" [class]="col.id + '-col'">
                                <ng-container *ngSwitchCase="'date'">{{ formatDate(expense.date) }}</ng-container>
                                <ng-container *ngSwitchCase="'expenseAccount'">{{ expense.expenseAccount }}</ng-container>
                                <ng-container *ngSwitchCase="'paidThrough'">{{ expense.paidThrough }}</ng-container>
                                <ng-container *ngSwitchCase="'amount'">
                                    {{ expense.currency }} {{ expense.amount | number:'1.3-3' }}
                                </ng-container>
                                <ng-container *ngSwitchDefault>{{ expense[col.id] }}</ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <div class="action-menu-container">
                                <button class="action-btn" (click)="toggleMenu(expense.id, $event)"><i
                                        class="las la-ellipsis-h"></i></button>

                                <div class="action-dropdown" *ngIf="openMenuId === expense.id">
                                    <button class="menu-item edit-btn"
                                        (click)="navigateToEdit(expense.id, $event)">Edit</button>
                                    <button class="menu-item delete-btn" (click)="openDeleteModal(expense, $event)">
                                        <div class="svg-icon"
                                            style="-webkit-mask-image: url('/icons/delete.svg'); mask-image: url('/icons/delete.svg');">
                                        </div>
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <!-- Empty State -->
                    <tr *ngIf="paginatedExpenses.length === 0">
                        <td colspan="6" style="padding: 0;">
                            <app-empty-state 
                                [title]="searchQuery ? 'No Expenses Found.' : 'No Expenses Found.'"
                                [subtitle]="searchQuery ? 'We couldn\'t find any expenses matching \'' + searchQuery + '\'' : 'It looks like you haven\'t added any expenses yet.'"
                                [actionLabel]="searchQuery ? '' : 'Add New Expense'" 
                                [actionIconClass]="searchQuery ? '' : 'las la-plus'" 
                                (actionClick)="navigateToNew()">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Pagination -->
        <app-pagination [totalItems]="filteredExpenses.length" [itemsPerPage]="itemsPerPage" [currentPage]="currentPage"
            (pageChange)="onPageChange($event)" (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <app-empty-state *ngIf="expenses.length === 0 && !searchQuery" title="No Expenses Found."
        subtitle="It looks like you haven't added any expenses yet." actionLabel="Add New Expense"
        actionIconClass="las la-plus" (actionClick)="navigateToNew()">
    </app-empty-state>

</div>

<!-- Manage Columns Side Panel -->
<app-manage-columns [isOpen]="isManageColumnsOpen" [columns]="availableColumns" (closePanel)="closeManageColumns()"
    (columnsChange)="onColumnsChange($event)">
</app-manage-columns>

<!-- Delete Confirmation Modal -->
<app-delete-modal
    [isOpen]="!!expenseToDelete || bulkDeletePending"
    [title]="bulkDeletePending ? 'Delete Expenses' : 'Delete Expense'"
    [message]="bulkDeletePending
        ? 'Are you sure you want to delete ' + selectedExpenseIds.size + ' selected expense(s)? This action cannot be undone.'
        : 'Are you sure you want to delete this expense? This action cannot be undone.'"
    (cancel)="closeDeleteModal()"
    (confirm)="confirmDelete()">
</app-delete-modal>
