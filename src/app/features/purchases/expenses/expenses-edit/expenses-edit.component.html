<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <app-breadcrumbs [items]="[
                { label: 'Expenses', url: '/purchases/expenses' },
                { label: isEditMode ? 'Edit Expense' : 'Add New Expense' }
            ]"></app-breadcrumbs>
            <h1 class="page-title">{{ isEditMode ? 'Edit Expense' : 'Add New Expense' }}</h1>
        </div>
        <div class="header-actions">
            <app-button variant="outline" (clicked)="openAttachmentsModal()">
                <svg svg-icon style="margin-right: 8px;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <g clip-path="url(#clip0_attach)">
                        <mask id="mask0_attach" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
                            <path d="M20 0H0V20H20V0Z" fill="white" />
                        </mask>
                        <g mask="url(#mask0_attach)">
                            <path d="M10.2752 17.7837C9.36683 17.7837 8.4585 17.442 7.76686 16.7503C6.38353 15.367 6.38353 13.1253 7.76686 11.742L9.8335 9.68367C10.0752 9.442 10.4752 9.442 10.7168 9.68367C10.9585 9.92533 10.9585 10.3253 10.7168 10.567L8.65016 12.6253C7.75853 13.517 7.75853 14.9753 8.65016 15.867C9.54183 16.7587 11.0002 16.7587 11.8918 15.867L15.1335 12.6253C16.1168 11.642 16.6585 10.3337 16.6585 8.942C16.6585 7.55029 16.1168 6.24196 15.1335 5.25863C13.1002 3.22529 9.80016 3.22529 7.76686 5.25863L4.23353 8.792C3.40853 9.617 2.9502 10.717 2.9502 11.8837C2.9502 13.0503 3.40853 14.1503 4.23353 14.9753C4.4752 15.217 4.4752 15.617 4.23353 15.8587C3.99186 16.1003 3.59186 16.1003 3.3502 15.8587C2.29186 14.792 1.7002 13.3837 1.7002 11.8837C1.7002 10.3837 2.28353 8.967 3.3502 7.90863L6.88353 4.37529C9.40016 1.85863 13.5002 1.85863 16.0168 4.37529C17.2335 5.59196 17.9085 7.21696 17.9085 8.942C17.9085 10.667 17.2335 12.292 16.0168 13.5087L12.7752 16.7503C12.0835 17.442 11.1835 17.7837 10.2752 17.7837Z" fill="#646569" />
                        </g>
                    </g>
                    <defs>
                        <clipPath id="clip0_attach">
                            <rect width="20" height="20" fill="white" />
                        </clipPath>
                    </defs>
                </svg>
                Attach Documents
            </app-button>
        </div>
    </div>

    <!-- Form Container -->
    <div class="form-container">
        <!-- Main Form Card -->
        <div class="form-card">
            <!-- Row 1: Expense Date, Paid Through, Currency -->
            <div class="form-grid form-grid-3" style="margin-bottom: 24px;">
                <div class="form-group">
                    <label>Expense Date <span class="required">*</span></label>
                    <input type="date" class="form-control date-input" [(ngModel)]="expenseData.expenseDate">
                </div>
                <div class="form-group">
                    <label>Paid Through <span class="required">*</span></label>
                    <app-custom-select 
                        [(ngModel)]="expenseData.paidThrough" 
                        [options]="paidThroughOptions" 
                        placeholder="Select an Account">
                    </app-custom-select>
                </div>
                <div class="form-group">
                    <label>Currency</label>
                    <app-custom-select 
                        [(ngModel)]="expenseData.currency" 
                        [options]="currencyOptions">
                    </app-custom-select>
                </div>
            </div>

            <!-- Row 2: Vendor, Reference Number -->
            <div class="form-grid form-grid-3">
                <div class="form-group">
                    <label>Vendor</label>
                    <app-custom-select 
                        [(ngModel)]="expenseData.vendorId" 
                        [options]="vendorOptions" 
                        placeholder="Select Vendor">
                    </app-custom-select>
                </div>
                <div class="form-group">
                    <label>Reference Number</label>
                    <app-custom-select 
                        [(ngModel)]="expenseData.referenceNumber" 
                        [options]="referenceOptions" 
                        placeholder="Enter Reference Number">
                    </app-custom-select>
                </div>
            </div>
        </div>

        <!-- Items Table Card -->
        <div class="form-card items-card">
            <div class="items-table">
                <!-- Table Header -->
                <div class="items-thead">
                    <div class="th-expense-account highlight-text">Expense Account</div>
                    <div class="th-notes">Notes</div>
                    <div class="th-amount highlight-text">Amount</div>
                    <div class="th-del"></div>
                </div>

                <!-- Table Rows -->
                <div class="items-tbody">
                    <div class="items-row" *ngFor="let item of lineItems">
                        <!-- Expense Account -->
                        <div class="td-expense-account">
                            <app-custom-select 
                                [(ngModel)]="item.expenseAccount" 
                                [options]="expenseAccountOptions" 
                                placeholder="Select Account">
                            </app-custom-select>
                        </div>

                        <!-- Notes -->
                        <div class="td-notes">
                            <input type="text" class="cell-input" [(ngModel)]="item.notes" placeholder="Enter Notes">
                        </div>

                        <!-- Amount -->
                        <div class="td-amount">
                            <input type="number" class="cell-input text-right" [(ngModel)]="item.amount" step="0.001" placeholder="0.000">
                        </div>

                        <!-- Delete -->
                        <div class="td-del">
                            <button class="del-btn" (click)="removeRow(item.id)" [disabled]="lineItems.length === 1">
                                <i class="las la-trash-alt icon-red"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Add Row Actions -->
                <div class="add-row-actions">
                    <button class="add-link-btn" (click)="addRow()">
                        <span class="add-plus">+</span> Add New Row
                    </button>
                </div>

                <!-- Totals Section -->
                <div class="totals-section">
                    <div class="total-row grand-total-row">
                        <span class="total-label">Expense Total ( BHD )</span>
                        <span class="total-value">{{ totalAmount | number:'1.3-3' }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="page-footer">
        <button class="footer-btn btn-cancel" (click)="cancel()">Cancel</button>
        <button class="footer-btn btn-draft" (click)="saveAsDraft()">Save as Draft</button>
        <button class="footer-btn btn-save" (click)="save()">Save</button>
    </div>
</div>

<!-- Attachments Modal -->
<app-attachments-modal
    *ngIf="isAttachmentsModalOpen"
    [isAttachmentsModalOpen]="isAttachmentsModalOpen"
    (closeModal)="closeAttachmentsModal()">
</app-attachments-modal>
