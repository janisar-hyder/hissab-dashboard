<div class="page-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-titles">
            <h1 class="page-title">Recurring Expenses</h1>
        </div>
        <div class="header-actions" *ngIf="recurringExpenses.length > 0">
            <app-bulk-actions [selectedCount]="selectedRecurringExpenseIds.size" [actions]="bulkActions"
                (actionSelected)="handleBulkAction($event)">
            </app-bulk-actions>
            <app-button variant="primary" iconPrefix="las la-plus" (clicked)="navigateToNew()">Add New Recurring Expense</app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 16V4M12 16L8 12M12 16L16 12" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Import
            </app-button>
            <app-button variant="outline">
                <svg svg-icon width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path
                        d="M19 16V18C19 18.5304 18.7893 19.0391 18.4142 19.4142C18.0391 19.7893 17.5304 20 17 20H7C6.46957 20 5.96086 19.7893 5.58579 19.4142C5.21071 19.0391 5 18.5304 5 18V16"
                        stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Export
            </app-button>
        </div>
    </div>

    <!-- Data Card -->
    <div class="data-card" *ngIf="recurringExpenses.length > 0 || searchQuery">

        <!-- Toolbar -->
        <div class="card-toolbar">
            <div class="search-box">
                <i class="las la-search search-icon"></i>
                <input type="text" placeholder="Search for something.." class="search-input" [(ngModel)]="searchQuery" (ngModelChange)="currentPage = 1">
                <i class="las la-times clear-icon" *ngIf="searchQuery" (click)="clearSearch()"></i>
            </div>

            <div class="toolbar-right">
                <app-custom-filter
                    [options]="filterOptions"
                    [currentFilter]="currentFilter"
                    activeLabelPrefix="All Recurring Expenses"
                    (filterChange)="setFilter($event)">
                </app-custom-filter>
                <app-button variant="outline" iconPrefix="las la-sliders-h" (clicked)="toggleManageColumns()">Manage Columns</app-button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-checkbox">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isPartiallySelected()" (change)="toggleAll($event)">
                                <span class="checkmark"></span>
                            </label>
                        </th>
                        <ng-container *ngFor="let col of availableColumns">
                            <th *ngIf="col.visible" [class.text-right]="col.id === 'amount'">
                                {{ col.label }}
                                <i [class]="sortColumn === col.id 
                                    ? (sortDirection === 'asc' ? 'las la-sort-up' : 'las la-sort-down')
                                    : 'las la-sort'"
                                   (click)="sort(col.id, $event)"></i>
                            </th>
                        </ng-container>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let re of paginatedExpenses" class="clickable-row" (click)="navigateToInfo(re.id)">
                        <td class="col-checkbox" (click)="$event.stopPropagation()">
                            <label class="custom-checkbox">
                                <input type="checkbox" [checked]="selectedRecurringExpenseIds.has(re.id)"
                                    (change)="toggleSelection(re.id)">
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <ng-container *ngFor="let col of availableColumns">
                            <td *ngIf="col.visible" [ngSwitch]="col.id" [class.text-right]="col.id === 'amount'">
                                <ng-container *ngSwitchCase="'profileName'">
                                    <span class="font-medium">{{ re.profileName }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'expenseAccount'">
                                    <span class="text-muted">{{ re.expenseAccount }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'frequency'">
                                    <span class="text-muted">{{ re.frequency }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'lastExpenseDate'">
                                    <span class="text-muted">{{ re.lastExpenseDate || '-' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'nextExpenseDate'">
                                    <span class="text-muted">{{ re.nextExpenseDate || '-' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'amount'">
                                    <span class="text-muted">BHD {{ re.amount | number:'1.3-3' }}</span>
                                </ng-container>
                                <ng-container *ngSwitchCase="'status'">
                                    <span class="status-pill" [ngClass]="'status-' + re.status.toLowerCase()">
                                        <span class="dot"></span>
                                        {{ re.status }}
                                    </span>
                                </ng-container>
                            </td>
                        </ng-container>
                        <td class="col-actions">
                            <div class="action-menu-container">
                                <button class="action-btn" (click)="toggleMenu(re.id, $event)"><i
                                        class="las la-ellipsis-h"></i></button>

                                <div class="action-dropdown" *ngIf="openMenuId === re.id">
                                    <button class="menu-item edit-btn"
                                        (click)="navigateToEdit(re.id, $event)">Edit</button>
                                    <button class="menu-item delete-btn" (click)="openDeleteModal(re, $event)">
                                        <div class="svg-icon"
                                            style="-webkit-mask-image: url('/icons/delete.svg'); mask-image: url('/icons/delete.svg');">
                                        </div>
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <!-- Empty State -->
                    <tr *ngIf="paginatedExpenses.length === 0">
                        <td [attr.colspan]="availableColumns.length + 2" style="padding: 0;">
                            <app-empty-state 
                                [title]="searchQuery ? 'No Recurring Expenses Found.' : 'No Recurring Expenses Found.'"
                                [subtitle]="searchQuery ? 'We couldn\'t find any recurring expenses matching \'' + searchQuery + '\'' : 'It looks like you haven\'t added any recurring expenses yet.'"
                                [actionLabel]="searchQuery ? '' : 'Add Recurring Expense'" 
                                [actionIconClass]="searchQuery ? '' : 'las la-plus'" 
                                (actionClick)="navigateToNew()">
                            </app-empty-state>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Pagination -->
        <app-pagination [totalItems]="filteredExpenses.length" [itemsPerPage]="itemsPerPage"
            [currentPage]="currentPage" (pageChange)="onPageChange($event)"
            (itemsPerPageChange)="onItemsPerPageChange($event)">
        </app-pagination>
    </div>

    <app-empty-state *ngIf="recurringExpenses.length === 0 && !searchQuery" title="No Recurring Expenses Found."
        subtitle="It looks like you haven't added any recurring expenses yet."
        actionLabel="Add Recurring Expense" actionIconClass="las la-plus" (actionClick)="navigateToNew()">
    </app-empty-state>

</div>

<!-- Global Shared Output Models -->
<app-manage-columns [isOpen]="isManageColumnsOpen" [columns]="availableColumns" (closePanel)="closeManageColumns()"
    (columnsChange)="onColumnsChange($event)">
</app-manage-columns>

<app-delete-modal [isOpen]="!!expenseToDelete" title="Delete Recurring Expense"
    message="Are you sure you want to delete this recurring expense? This action cannot be undone."
    (cancel)="closeDeleteModal()" (confirm)="confirmDelete()">
</app-delete-modal>
